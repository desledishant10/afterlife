name: Release

# On a version tag (v*): build the sdist + wheel, create a GitHub Release with
# them attached, publish the Docker image to GHCR, and (once enabled) publish
# to PyPI via Trusted Publishing. Uses raw `gh` and `docker` rather than
# third-party actions to keep the supply chain small.
#
# One-time PyPI setup on your side, then the pypi job runs automatically:
#   1. Register the project (afterlife-audit) on PyPI.
#   2. PyPI project -> Settings -> Publishing -> add a GitHub trusted publisher
#      for owner=desledishant10, repo=afterlife, workflow=release.yml,
#      environment=pypi.
#   3. This repo -> Settings -> Environments -> create environment "pypi".
#   4. This repo -> Settings -> Secrets and variables -> Actions -> Variables ->
#      add PYPI_TRUSTED_PUBLISHING = true.
# Docker (GHCR) and the GitHub Release need no setup; they use GITHUB_TOKEN.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  docker:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          image="ghcr.io/${{ github.repository }}"
          version="${GITHUB_REF_NAME#v}"
          docker build -t "$image:$version" -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"

  pypi:
    # Skips (does not fail) until the PYPI_TRUSTED_PUBLISHING repo variable is
    # set to "true" after the one-time PyPI setup above.
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_TRUSTED_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
