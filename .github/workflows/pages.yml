name: Deploy landing page

# Publishes site/index.html (and nothing else) to GitHub Pages. Serving only the
# site/ folder keeps the internal docs (GO-TO-MARKET.md, KEY-MANAGEMENT.md) off
# the public marketing URL.
#
# One-time setup by the repo owner (the workflow token cannot create a Pages
# site itself): repo Settings -> Pages -> Build and deployment -> Source =
# "GitHub Actions". After that, every push that touches site/ redeploys, and you
# can also deploy on demand from the Actions tab (Run workflow).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
