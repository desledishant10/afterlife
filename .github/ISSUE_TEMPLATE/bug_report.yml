name: Bug report
description: Something in Afterlife behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** include real credentials,
        tokens, account IDs, or any output that contains them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The commands you ran (with secrets redacted).
      placeholder: |
        1. afterlife scan ...
        2. afterlife analyze ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Afterlife version
      description: Output of `afterlife --version` or the commit SHA.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.x"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages or tracebacks, with all secrets/PII removed.
      render: shell
