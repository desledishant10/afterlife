[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI (the import package and CLI command stay
# "afterlife"; the bare name "afterlife" was already taken on PyPI).
name = "afterlife-audit"
version = "0.2.0"
description = "Surface credentials that outlive their owners: a ghost-access auditor."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["security", "iam", "audit", "credentials", "ghost-access", "offboarding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "boto3>=1.34",
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.2",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "moto>=5.0",
    "freezegun>=1.5",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/desledishant10/afterlife"
Repository = "https://github.com/desledishant10/afterlife"
Issues = "https://github.com/desledishant10/afterlife/issues"
Changelog = "https://github.com/desledishant10/afterlife/blob/main/CHANGELOG.md"

[project.scripts]
afterlife = "afterlife.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/afterlife"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer requires typer.Option()/Argument() calls as parameter defaults, which
# ruff flags as B008 (function call in default argument). It is the intended
# idiom for the CLI, not a bug.
"src/afterlife/cli.py" = ["B008"]
# Contains an embedded HTML report template where markup line length is
# inherent; E501 (line-length) does not meaningfully apply to those lines.
"src/afterlife/reporting/html_report.py" = ["E501"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
